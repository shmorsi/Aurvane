[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurvane"
version = "0.2.0"
description = "Every agent action: signed, bounded, visible. A trust layer for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sherif Morsi" }]
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8"]
video = ["playwright>=1.45"]
dojo = ["agentdojo==0.1.35"]  # the public benchmark (bench/agentdojo/)

[project.urls]
Homepage = "https://shmorsi.github.io/aurvane/"
Repository = "https://github.com/shmorsi/Aurvane"

[tool.setuptools]
packages = ["aurvane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
