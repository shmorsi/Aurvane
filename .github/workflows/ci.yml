name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q
      - name: Offline benchmark, under 2 seconds
        run: timeout 2 python -m aurvane.bench --out /tmp/bench
      - name: Results in the repo match a fresh run
        run: diff <(python -c "import json;print(json.dumps(json.load(open('/tmp/bench/worst-case_summary.json')),sort_keys=True))") <(python -c "import json;print(json.dumps(json.load(open('bench/results/worst-case_summary.json')),sort_keys=True))")
